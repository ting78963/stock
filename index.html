// 資金流向柱量圖（五根）
function renderInstChart(days,fStreak,tStreak){
  const KEYS=['f','g','t','dealer','r'];
  const NAMES={f:'外資',g:'官股',t:'投信',dealer:'自營',r:'散戶'};
  const POS={f:'#b91c1c',g:'#dc2626',t:'#7f1d1d',dealer:'#ef4444',r:'#fca5a5'};
  const NEG={f:'#166534',g:'#16a34a',t:'#14532d',dealer:'#22c55e',r:'#86efac'};
  const maxVal=Math.max(...days.flatMap(d=>KEYS.map(k=>Math.abs(d[k]||0))),1);
  window._instDays=days;
  const barsHtml=days.map((d,idx)=>`
    <div style="display:flex;flex-direction:column;align-items:center;flex-shrink:0;width:50px;cursor:pointer;padding:2px;border-radius:6px" onclick="showInstDetail(${idx})" id="inst-col-${idx}">
      <div style="display:flex;gap:2px;align-items:flex-end;height:85px">
        ${KEYS.map(k=>{const v=d[k]||0;const h=Math.max(Math.round(Math.abs(v)/maxVal*82),3);return`<div style="width:7px;height:${h}px;background:${v>=0?POS[k]:NEG[k]};border-radius:2px 2px 0 0;align-self:flex-end"></div>`;}).join('')}
      </div>
      <div style="font-size:10px;color:var(--text3);margin-top:4px">${d.date}</div>
      <div style="display:flex;gap:2px;margin-top:3px">
        ${KEYS.map(k=>`<div style="font-size:6.5px;color:var(--text3);width:7px;text-align:center;writing-mode:vertical-lr;height:20px;overflow:hidden">${NAMES[k]}</div>`).join('')}
      </div>
    </div>`).join('');

  const signalHtml=(()=>{
    let h='';
    if(fStreak.dir>0&&tStreak.dir>0&&fStreak.streak>=2&&tStreak.streak>=2)
      h+=`<div style="display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--rbg);border:0.5px solid var(--rbr);border-radius:var(--rs);margin-bottom:6px"><div style="width:7px;height:7px;border-radius:50%;background:var(--red);flex-shrink:0"></div><span style="font-size:13px;font-weight:500;color:var(--red)">外資＋投信同步買超</span><span style="font-size:11px;color:var(--text3);margin-left:auto">主力共識看多</span></div>`;
    return h;
  })();

  return`
  <div style="background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:12px">
    <div style="font-size:10px;font-weight:600;color:var(--text3);letter-spacing:.1em;text-transform:uppercase;margin-bottom:12px">資金流向　10日</div>
    <div style="overflow-x:auto;scrollbar-width:none"><div style="display:flex;gap:5px;align-items:flex-end;min-width:max-content;padding:4px 0">${barsHtml}</div></div>
    <div style="font-size:10px;color:var(--text3);text-align:center;margin:6px 0 4px">買超=紅　賣超=綠　↑ 點任一天看詳細</div>
    <div id="instDetailPanel" style="display:none;background:var(--bg3);border-radius:var(--rs);padding:12px;margin:8px 0"></div>
    <div style="height:0.5px;background:var(--border2);margin:10px 0"></div>
    <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:8px">
      ${fStreak.streak>0?`<span style="font-size:13px;color:var(--text2)">外資連續 <strong style="color:${fStreak.dir>0?'var(--red)':'var(--green)'}">${fStreak.streak}天${fStreak.dir>0?'買超':'賣超'}</strong></span>`:''}
      ${tStreak.streak>0?`<span style="font-size:13px;color:var(--text2)">投信連續 <strong style="color:${tStreak.dir>0?'var(--red)':'var(--green)'}">${tStreak.streak}天${tStreak.dir>0?'買超':'賣超'}</strong></span>`:''}
    </div>
    ${signalHtml}
  </div>`;
}

function showInstDetail(idx){
  const days=window._instDays||[]; const d=days[idx]; if(!d) return;
  const KEYS=['f','g','t','dealer','r'];
  const NAMES={f:'外資',g:'官股',t:'投信',dealer:'自營商',r:'散戶'};
  const POS={f:'#b91c1c',g:'#dc2626',t:'#7f1d1d',dealer:'#ef4444',r:'#fca5a5'};
  const NEG={f:'#166534',g:'#16a34a',t:'#14532d',dealer:'#22c55e',r:'#86efac'};
  const maxAbs=Math.max(...KEYS.map(k=>Math.abs(d[k]||0)),1);
  const total=(d.f||0)+(d.g||0)+(d.t||0);
  const panel=document.getElementById('instDetailPanel'); if(!panel) return;
  panel.style.display='block';
  panel.innerHTML=`
    <div style="display:flex;justify-content:space-between;margin-bottom:10px">
      <div style="font-size:14px;font-weight:600;color:var(--text)">${d.date} 詳細</div>
      <div onclick="document.getElementById('instDetailPanel').style.display='none'" style="cursor:pointer;color:var(--text3)">✕</div>
    </div>
    <div style="display:flex;gap:8px;align-items:flex-end;height:140px;margin-bottom:10px">
      ${KEYS.map(k=>{const v=d[k]||0;const h=Math.max(Math.round(Math.abs(v)/maxAbs*120),4);const color=v>=0?POS[k]:NEG[k];const sign=v>=0?'+':'';return`<div style="display:flex;flex-direction:column;align-items:center;flex:1"><div style="display:flex;align-items:flex-end;justify-content:center;width:100%;height:125px"><div style="width:30px;height:${h}px;background:${color};border-radius:4px 4px 0 0"></div></div><div style="font-size:11px;color:var(--text2);margin-top:4px">${NAMES[k]}</div><div style="font-size:11px;font-weight:700;color:${color}">${sign}${Math.round(Math.abs(v)).toLocaleString()}</div><div style="font-size:10px;color:var(--text3)">張</div></div>`;}).join('')}
    </div>
    <div style="background:var(--bg);border-radius:var(--rs);padding:10px 14px;display:flex;justify-content:space-between;align-items:center">
      <div><div style="font-size:12px;color:var(--text3)">主力合計（外資＋官股＋投信）</div></div>
      <div style="font-size:16px;font-weight:700;color:${total>=0?'var(--red)':'var(--green)'}">${total>=0?'+':''}${Math.round(total).toLocaleString()} 張</div>
    </div>`;
}

// 新版風險計算
function calcNewRisk(ma20d, ma20w){
  const price=parseFloat(document.getElementById('riskPrice')?.value);
  const shares=parseFloat(document.getElementById('riskShares')?.value)||1000;
  const customPct=parseFloat(document.getElementById('riskCustomPct')?.value)||5;
  const result=document.getElementById('riskResult');
  if(!price||price<=0||!result) return;
  result.style.display='block';
  const loss20d=Math.round((price-ma20d)*shares);
  const l20el=document.getElementById('loss20d');
  if(l20el){l20el.textContent=(loss20d>0?'-':'')+Math.abs(loss20d).toLocaleString()+' 元';l20el.style.color='var(--green)';}
  const lossC=Math.round(price*(customPct/100)*shares);
  const lcEl=document.getElementById('lossCustom');
  if(lcEl) lcEl.textContent='-'+lossC.toLocaleString()+' 元';
  const dev=ma20d?((price-ma20d)/ma20d*100):0;
  const devEl=document.getElementById('deviate20d');
  if(devEl){devEl.textContent=(dev>=0?'+':'')+dev.toFixed(2)+'%　'+(dev>10?'乖離過大':dev>5?'乖離稍大，留意':'乖離正常');devEl.style.color=dev>10?'var(--red)':dev>5?'var(--amber)':'var(--green)';}
}
