// 族群歷史量比記錄（localStorage持久化）
const GRP_HIST_KEY='grp_vol_hist_v1';
function getGrpHist(){ try{return JSON.parse(localStorage.getItem(GRP_HIST_KEY))||{};}catch(e){return{};} }
function saveGrpHist(h){ localStorage.setItem(GRP_HIST_KEY,JSON.stringify(h)); }

// 取得交易日清單
function getTradingDaysG(allPrice,n=20){
  const dates=new Set();
  Object.values(allPrice).forEach(rows=>(rows||[]).forEach(r=>dates.add(r.date)));
  return[...dates].sort().slice(-n);
}

// 解析法人資料（指定日期）
function parseInstG(rows,date){
  let foreignBuy=0,trustBuy=0;
  (rows||[]).filter(r=>r.date===date).forEach(r=>{
    const net=(parseInt(r.buy||0)-parseInt(r.sell||0))/1000;
    const n=r.name||'';
    if((n==='Foreign_Investor'||n.includes('外資'))&&!n.includes('自營')) foreignBuy+=net;
    else if(n==='Investment_Trust'||n.includes('投信')) trustBuy+=net;
  });
  return{foreignBuy,trustBuy};
}

// 計算連續買超/賣超天數
function calcStreakG(arr){
  if(!arr||!arr.length) return{streak:0,dir:0};
  const last=arr[arr.length-1];
  const dir=last>0?1:last<0?-1:0;
  if(!dir) return{streak:0,dir:0};
  let streak=0;
  for(let i=arr.length-1;i>=0;i--){
    if(dir===1&&arr[i]>0) streak++;
    else if(dir===-1&&arr[i]<0) streak++;
    else break;
  }
  return{streak,dir};
}

// 計算族群某天的成交量與法人
function calcGroupDay(g,allPrice,allInst,date){
  let totalVol=0,foreignBuy=0,trustBuy=0,count=0;
  g.stocks.forEach(id=>{
    const pRow=(allPrice[id]||[]).find(r=>r.date===date);
    if(!pRow) return;
    totalVol+=parseInt(pRow.Trading_Volume||0)/1000;
    const inst=parseInstG(allInst[id]||[],date);
    foreignBuy+=inst.foreignBuy;
    trustBuy+=inst.trustBuy;
    count++;
  });
  return{totalVol,foreignBuy,trustBuy,count};
}

// 異動區持久化邏輯
function updateGrpHistState(grpId,todayStr,volRatio){
  const hist=getGrpHist();
  if(!hist[grpId]) hist[grpId]={enterDate:null,days:0,shrinkDays:0,lastVolRatios:[]};
  const s=hist[grpId];

  if(volRatio>=1.5){
    // 放量日
    if(!s.enterDate){ s.enterDate=todayStr; s.days=1; s.shrinkDays=0; }
    else { s.days++; s.shrinkDays=0; }
    s.lastVolRatios.push(volRatio);
    if(s.lastVolRatios.length>5) s.lastVolRatios.shift();
  } else {
    // 量縮日
    if(s.enterDate){
      s.shrinkDays++;
      s.days++; // 量縮也計天數
      s.lastVolRatios.push(volRatio);
      if(s.lastVolRatios.length>5) s.lastVolRatios.shift();
      // 第3天量縮驗證：量能需 > 前兩天均量×1.5
      if(s.shrinkDays>=3){
        const prev2=s.lastVolRatios.slice(-3,-1);
        const avg2=prev2.reduce((a,b)=>a+b,0)/Math.max(prev2.length,1);
        if(volRatio<avg2*1.5){
          // 移出異動區
          hist[grpId]={enterDate:null,days:0,shrinkDays:0,lastVolRatios:[]};
        }
      }
    }
  }
  saveGrpHist(hist);
  return hist[grpId];
}

// 訊號文字
function getSigHtml(foreign,trust){
  const fBuy=foreign>0,tBuy=trust>0;
  if(fBuy&&tBuy)   return`<span style="font-size:11px;padding:2px 8px;border-radius:8px;font-weight:500;background:var(--rbg);color:var(--red);border:0.5px solid var(--rbr)">外資投信共買 → 追</span>`;
  if(!fBuy&&!tBuy) return`<span style="font-size:11px;padding:2px 8px;border-radius:8px;font-weight:500;background:var(--gbg);color:var(--green);border:0.5px solid var(--gbr)">外資投信共賣 → 出貨警示</span>`;
  if(fBuy&&!tBuy)  return`<span style="font-size:11px;padding:2px 8px;border-radius:8px;font-weight:500;background:var(--abg);color:var(--amber);border:0.5px solid var(--abr)">外資買／投信賣 → 觀察</span>`;
  return`<span style="font-size:11px;padding:2px 8px;border-radius:8px;font-weight:500;background:var(--abg);color:var(--amber);border:0.5px solid var(--abr)">投信買／外資賣 → 觀察</span>`;
}

function fmtV(v){ if(v>=10000) return(v/10000).toFixed(2).replace(/.?0+$/,'')+'億'; if(v>=1000) return(v/1000).toFixed(0)+'千萬'; if(v>=100) return(v/100).toFixed(0)+'百萬'; return Math.round(v)+'萬'; }
function fmtInst(v){ return(v>=0?'+':'')+Math.round(v).toLocaleString()+'張'; }

// 渲染族群資金主畫面
function renderMoney(allPrice,allInst,tradingDays){
  const today=tradingDays[tradingDays.length-1];
  const yesterday=tradingDays[tradingDays.length-2];
  const todayStr=today;

  // 計算每族群今日與昨日資料
  const grpData=GROUPS.map(g=>{
    const td=calcGroupDay(g,allPrice,allInst,today);
    const yd=calcGroupDay(g,allPrice,allInst,yesterday);
    // 過去10日均量（用於量比）
    const last10=tradingDays.slice(-11,-1);
    const avg10=last10.reduce((s,d)=>{
      const dd=calcGroupDay(g,allPrice,allInst,d);
      return s+dd.totalVol;
    },0)/Math.max(last10.length,1);
    const volRatio=avg10>0?td.totalVol/avg10:0;
    // 法人連續天數
    const foreignArr=tradingDays.slice(-10).map(d=>calcGroupDay(g,allPrice,allInst,d).foreignBuy);
    const trustArr=tradingDays.slice(-10).map(d=>calcGroupDay(g,allPrice,allInst,d).trustBuy);
    const fStreak=calcStreakG(foreignArr);
    const tStreak=calcStreakG(trustArr);
    // 異動區狀態
    const histState=updateGrpHistState(g.id,todayStr,volRatio);
    return{...g,td,yd,volRatio,avg10,fStreak,tStreak,histState};
  });

  // 排名（今日 vs 昨日，以成交量）
  const todayRanked=[...grpData].sort((a,b)=>b.td.totalVol-a.td.totalVol);
  const yestRanked=[...grpData].sort((a,b)=>b.yd.totalVol-a.yd.totalVol);
  todayRanked.forEach((g,i)=>{
    g.rank=i+1;
    const yi=yestRanked.findIndex(x=>x.id===g.id);
    g.prevRank=yi+1;
    g.rankDiff=g.prevRank-g.rank;
  });

  // 異動區：量比≥1.5 → 進入，依法人方向分買超/賣超
  const alertGroups=todayRanked.filter(g=>g.histState.enterDate);

    return`<span style="font-size:10px;padding:2px 6px;border-radius:6px;background:var(--bg3);color:var(--text3);border:0.5px solid var(--border);white-space:nowrap">－</span>`;

  // 族群卡片HTML
  function grpCardHtml(g,showRank=true,alertType=''){
    const isAlert=!!g.histState.enterDate;
    const borderColor=alertType==='buy'?'var(--rbr)':alertType==='sell'?'var(--gbr)':'var(--border)';

      </div>`:''}

  // 異動橫幅HTML — 買超在上，賣超在下
  const alertHtml=(alertBuy.length||alertSell.length)?`

          <div style="font-size:11px;font-weight:500;color:var(--green);letter-spacing:.06em;text-transform:uppercase">⚠️ 資金流出異動</div>
          <span style="font-size:10px;color:var(--text3);opacity:0.6">點卡片看成分股</span>
        </div>
        ${alertSell.map(g=>grpCardHtml(g,false,'sell')).join('')}
      `:''}
    </div>`:'';

  // 主內容
  const tapHint=`<span style="font-size:10px;color:var(--text3);opacity:0.6;font-weight:400;letter-spacing:0">點卡片看成分股</span>`;

  document.getElementById('money-main').innerHTML=html;

  // 綁定卡片點擊 → 開族群詳細

// 資料抓取（含快取）
let _moneyLoaded=false;
let _moneyCache=null;

async function fetchMoneyData(){
  const todayStr=new Date().toISOString().slice(0,10);
  const cached=JSON.parse(localStorage.getItem('grp_money_cache_v1')||'null');
  if(cached&&cached.date===todayStr&&cached.allPrice&&cached.allInst){
    _moneyCache=cached;
    return cached;
  }
  const startDate=(()=>{const d=new Date();d.setDate(d.getDate()-45);return d.toISOString().slice(0,10);})();
  const allIds=new Set();
  GROUPS.forEach(g=>g.stocks.forEach(s=>allIds.add(s)));
  const ids=[...allIds];
  const allPrice={},allInst={};
  let done=0,total=ids.length*2;
  const setProgress=()=>{};
  setProgress();

  for(const id of ids){
    allPrice[id]=(await fmFetch('TaiwanStockPrice',id,startDate))||[];
    done++;
    await new Promise(r=>setTimeout(r,150));
    allInst[id]=(await fmFetch('TaiwanStockInstitutionalInvestorsBuySell',id,startDate))||[];
    done++;
    await new Promise(r=>setTimeout(r,150));
  }
  const cache={date:todayStr,allPrice,allInst};
  localStorage.setItem('grp_money_cache_v1',JSON.stringify(cache));
  _moneyCache=cache;
  return cache;
}

async function initMoney(){
  if(_moneyLoaded&&_moneyCache) return;
  _moneyLoaded=true;
  document.getElementById('money-main').innerHTML=`<div style="display:flex;align-items:center;justify-content:center;min-height:260px;color:var(--text3)"><div style="font-size:24px;animation:spin 1s linear infinite;display:inline-block">↺</div></div>`;
  try{
    const cache=await fetchMoneyData();
    const tradingDays=getTradingDaysG(cache.allPrice,20);
    if(tradingDays.length<2){
      document.getElementById('money-main').innerHTML=`<div style="padding:20px;color:var(--amber)">⚠️ 資料不足，請按更新重試</div>`;
      return;
    }
    renderMoney(cache.allPrice,cache.allInst,tradingDays);
  } catch(e){
    document.getElementById('money-main').innerHTML=`<div style="padding:20px;color:var(--red)">載入失敗：${e.message}</div>`;
    _moneyLoaded=false;
  }
}

async function refreshMoney(){
  localStorage.removeItem('grp_money_cache_v1');
  _moneyLoaded=false;
  _moneyCache=null;
  await initMoney();
}

function calcNewRisk(ma20d, ma10d, ma20w){
  const price=parseFloat(document.getElementById('riskPrice')?.value);
  const shares=parseFloat(document.getElementById('riskShares')?.value)||1000;
  const customPct=parseFloat(document.getElementById('riskCustomPct')?.value)||5;
  const result=document.getElementById('riskResult');
  if(!price||price<=0||!result) return;
  result.style.display='block';
  // 日20MA停損
  const loss20d=Math.round((price-ma20d)*shares);
  const l20el=document.getElementById('loss20d');
  if(l20el){l20el.textContent='-'+Math.abs(loss20d).toLocaleString()+' 元';l20el.style.color='var(--green)';}
  // 日10MA停損
  if(ma10d>0){
    const loss10d=Math.round((price-ma10d)*shares);
    const l10el=document.getElementById('loss10d');
    if(l10el){l10el.textContent='-'+Math.abs(loss10d).toLocaleString()+' 元';l10el.style.color='var(--green)';}
  }
  // 自訂停損%
  const lossC=Math.round(price*(customPct/100)*shares);
  const lcEl=document.getElementById('lossCustom');
  if(lcEl){lcEl.textContent='-'+lossC.toLocaleString()+' 元';lcEl.style.color='var(--green)';}
  // 乖離率
  const dev=ma20d?((price-ma20d)/ma20d*100):0;
  const devEl=document.getElementById('deviate20d');
  if(devEl){devEl.textContent=(dev>=0?'+':'')+dev.toFixed(2)+'%　'+(dev>10?'乖離過大':dev>5?'乖離稍大，留意':'乖離正常');devEl.style.color=dev>10?'var(--red)':dev>5?'var(--amber)':'var(--green)';}
}

function genRuleSummary(d){
  if(!d) return '市場數據載入中...';
  const parts=[];
  const ndx=d.nasdaq;
  if(ndx){
    if(ndx.chg_pct>=1.5) parts.push(`那斯達克大漲 +${ndx.chg_pct.toFixed(1)}%`);
    else if(ndx.chg_pct>=0.5) parts.push(`那斯達克小漲 +${ndx.chg_pct.toFixed(1)}%`);
    else if(ndx.chg_pct<=-1.5) parts.push(`那斯達克重跌 ${ndx.chg_pct.toFixed(1)}%`);
    else if(ndx.chg_pct<=-0.5) parts.push(`那斯達克小跌 ${ndx.chg_pct.toFixed(1)}%`);
    else parts.push(`那斯達克持平 ${ndx.chg_pct>=0?'+':''}${ndx.chg_pct.toFixed(1)}%`);
  }
  const sox=d.sox;
  if(sox){
    if(sox.chg_pct>=2) parts.push(`費半大漲 +${sox.chg_pct.toFixed(1)}%，半導體族群動能強`);
    else if(sox.chg_pct>=1) parts.push(`費半上漲 +${sox.chg_pct.toFixed(1)}%`);
    else if(sox.chg_pct<=-2) parts.push(`費半重跌 ${sox.chg_pct.toFixed(1)}%，半導體族群留意`);
    else if(sox.chg_pct<=-1) parts.push(`費半下跌 ${sox.chg_pct.toFixed(1)}%`);
  }
  const tsm=d.tsm;
  if(tsm){
    if(tsm.chg_pct>=2) parts.push(`台積電ADR上漲 +${tsm.chg_pct.toFixed(1)}%`);
    else if(tsm.chg_pct<=-2) parts.push(`台積電ADR下跌 ${tsm.chg_pct.toFixed(1)}%`);
  }
  const nvda=d.nvda;
  if(nvda){
    if(nvda.chg_pct>=3) parts.push(`輝達大漲 +${nvda.chg_pct.toFixed(1)}%，AI族群動能強`);
    else if(nvda.chg_pct<=-3) parts.push(`輝達大跌 ${nvda.chg_pct.toFixed(1)}%，AI族群留意`);
  }
  const vix=d.vix;
  if(vix){
    if(vix.close>=25) parts.push(`VIX ${vix.close.toFixed(1)}，市場恐慌情緒偏高`);
    else if(vix.close>=20) parts.push(`VIX ${vix.close.toFixed(1)}，市場略有不安`);
    else parts.push(`VIX ${vix.close.toFixed(1)}，市場情緒穩定`);
  }
  let bullCount=0,bearCount=0;
  if(ndx&&ndx.chg_pct>=0.5) bullCount++; else if(ndx&&ndx.chg_pct<=-0.5) bearCount++;
  if(sox&&sox.chg_pct>=1) bullCount++; else if(sox&&sox.chg_pct<=-1) bearCount++;
  if(tsm&&tsm.chg_pct>=1) bullCount++; else if(tsm&&tsm.chg_pct<=-1) bearCount++;
  if(vix&&vix.close<20) bullCount++; else if(vix&&vix.close>=25) bearCount++;
  const direction=bullCount>=3?'整體數據偏多方':bearCount>=3?'整體數據偏空方':'整體數據中性';
  return (parts.length?parts.join('；')+'。':'')+direction+'。\n⚠️ 本摘要僅為市場數據整理，不構成投資建議。';
}

  }

  // 3. 台灣市場（FinMind TAIEX）
  try{
    const start90=(()=>{const d=new Date();d.setMonth(d.getMonth()-6);return d.toISOString().slice(0,10);})();
    const taiexRows=await fmFetch('TaiwanStockPrice','TAIEX',start90)||[];
    if(taiexRows.length>=2){
      const sorted=[...taiexRows].sort((a,b)=>a.date.localeCompare(b.date));
      const last=sorted[sorted.length-1];
      const prev=sorted[sorted.length-2];
      const close=parseFloat(last.close);
      const prevClose=parseFloat(prev.close);
      const chg=close-prevClose;
      const chgPct=prevClose>0?chg/prevClose*100:0;
      const vEl=document.getElementById('taiex-val');
      const cEl=document.getElementById('taiex-chg');
      if(vEl) vEl.textContent=Math.round(close).toLocaleString();
      if(cEl){
        cEl.textContent=`${chg>=0?'+':''}${chg.toFixed(0)} (${chgPct>=0?'+':''}${chgPct.toFixed(2)}%)`;
        cEl.style.color=chg>=0?'var(--red)':'var(--green)';
      }
      // 大盤季線乖離（60日均）— 跟個股分析相同邏輯
      if(sorted.length>=60){
        const closes=sorted.map(r=>parseFloat(r.close)||0);
        const ma60=closes.slice(-60).reduce((a,b)=>a+b,0)/60;
        const dev=(close-ma60)/ma60*100;
        const devEl=document.getElementById('deviate-val');
        const devSub=document.getElementById('deviate-sub');
        const devNote=document.getElementById('deviate-note');
        if(devEl){devEl.textContent=(dev>=0?'+':'')+dev.toFixed(2)+'%';devEl.style.color=dev>=14?'var(--amber)':dev<-10?'var(--green)':'var(--text)';}
        if(devSub) devSub.textContent=`60日均線 ${Math.round(ma60).toLocaleString()}`;
        if(devNote) devNote.textContent=dev>=14?'⚠️ 乖離偏大，留意回調':dev<-10?'✓ 大幅低於均線':'✅ 乖離正常';
      }
    }
  }catch(e){}

  // 4. 匯率（FinMind）
  try{
    const start=(()=>{const d=new Date();d.setDate(d.getDate()-10);return d.toISOString().slice(0,10);})();
    const fxRows=await fmFetch('TaiwanExchangeRate','USD',start)||[];
    if(fxRows.length>=2){
      const sorted=[...fxRows].sort((a,b)=>a.date.localeCompare(b.date));
      const last=sorted[sorted.length-1];
      const prev=sorted[sorted.length-2];
      const rate=parseFloat(last.spot_sell||last.cash_sell||0);
      const prevRate=parseFloat(prev.spot_sell||prev.cash_sell||0);
      const chg=rate-prevRate;
      const fxEl=document.getElementById('fx-val');
      const fxNote=document.getElementById('fx-note');
      if(fxEl) fxEl.textContent=rate.toFixed(3);
      if(fxNote){
        fxNote.textContent=`${chg>=0?'+':''}${chg.toFixed(3)} 台幣${chg>0?'貶值':'升值'}`;
        fxNote.style.color=chg>0?'var(--green)':'var(--red)';
      }
    }
  }catch(e){}

  // 5. Claude API 市場摘要
  genAiSummary(intlData);

  // 6. 族群資金前三
  loadHomeGroups();
}

    root.style.setProperty('--fs-xl','1.333rem');
    root.style.setProperty('--fs-2xl','1.6rem');
    root.style.setProperty('--fs-3xl','2rem');
  } else if(size==='lg'){
    root.style.setProperty('--fs-xs','0.867rem');
    root.style.setProperty('--fs-sm','0.933rem');
    root.style.setProperty('--fs-md','1rem');
    root.style.setProperty('--fs-lg','1.133rem');
    root.style.setProperty('--fs-xl','1.267rem');
    root.style.setProperty('--fs-2xl','1.467rem');
    root.style.setProperty('--fs-3xl','1.8rem');
  } else {
    root.style.setProperty('--fs-xs','0.8rem');
    root.style.setProperty('--fs-sm','0.867rem');
    root.style.setProperty('--fs-md','0.933rem');
    root.style.setProperty('--fs-lg','1rem');
    root.style.setProperty('--fs-xl','1.133rem');
    root.style.setProperty('--fs-2xl','1.4rem');
    root.style.setProperty('--fs-3xl','1.8rem');
  }
  localStorage.setItem('font_size', size);
  renderSettings();
}

// 新版風險計算
function calcNewRisk(ma20d, ma20w){
  const price=parseFloat(document.getElementById('riskPrice')?.value);
  const shares=parseFloat(document.getElementById('riskShares')?.value)||1000;
  const customPct=parseFloat(document.getElementById('riskCustomPct')?.value)||5;
  const result=document.getElementById('riskResult');
  if(!price||price<=0||!result) return;
  result.style.display='block';
  const loss20d=Math.round((price-ma20d)*shares);
  const l20el=document.getElementById('loss20d');
  if(l20el){l20el.textContent=(loss20d<=0?'':'-')+Math.abs(loss20d).toLocaleString()+' 元';l20el.style.color='var(--green)';}
  const lossC=Math.round(price*(customPct/100)*shares);
  const lcEl=document.getElementById('lossCustom');
  if(lcEl) lcEl.textContent='-'+lossC.toLocaleString()+' 元';
  const dev=ma20d?((price-ma20d)/ma20d*100):0;
  const devEl=document.getElementById('deviate20d');
  if(devEl){
    devEl.textContent=(dev>=0?'+':'')+dev.toFixed(2)+'%　'+(dev>10?'乖離過大':dev>5?'乖離稍大，留意':'乖離正常');
    devEl.style.color=dev>10?'var(--red)':dev>5?'var(--amber)':'var(--green)';
  }
}
