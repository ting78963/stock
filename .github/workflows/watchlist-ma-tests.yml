name: Watchlist MA regression tests
on:
  pull_request:
    paths:
      - 'index.html'
      - 'tests/watchlist-ma.test.cjs'
      - '.github/workflows/watchlist-ma-tests.yml'
  push:
    branches:
      - 'feat/weekly-ma-near-cross-20261101'
    paths:
      - 'index.html'
      - 'tests/watchlist-ma.test.cjs'
      - '.github/workflows/watchlist-ma-tests.yml'
  workflow_dispatch:
jobs:
  watchlist-regression:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run watchlist regression tests
        run: node --test tests/watchlist-ma.test.cjs
