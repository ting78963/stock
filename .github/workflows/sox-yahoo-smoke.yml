name: SOX Yahoo source smoke test
on:
  push:
    branches: [fix/sox-display-restore-20261124]
    paths: [.github/workflows/sox-yahoo-smoke.yml]
  workflow_dispatch:
jobs:
  check-yahoo:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check Yahoo SOX response without credentials
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.error
          urls = [
            'https://query1.finance.yahoo.com/v7/finance/quote?symbols=%5ESOX',
            'https://query1.finance.yahoo.com/v8/finance/chart/%5ESOX?range=5d&interval=1d',
          ]
          for url in urls:
            try:
              req = urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'application/json'})
              with urllib.request.urlopen(req,timeout=10) as resp:
                d=json.load(resp)
              if 'quoteResponse' in d:
                rows=d['quoteResponse'].get('result',[])
                print('quote endpoint:', 'OK' if rows else 'EMPTY', [(q.get('symbol'),q.get('regularMarketPrice'),q.get('regularMarketTime')) for q in rows])
              else:
                result=d.get('chart',{}).get('result') or []
                meta=result[0].get('meta',{}) if result else {}
                print('chart endpoint:', 'OK' if result else 'EMPTY',meta.get('symbol'),meta.get('regularMarketPrice'),meta.get('regularMarketTime'))
            except Exception as e:
              print('endpoint failed:',type(e).__name__,str(e)[:180])
          PY
